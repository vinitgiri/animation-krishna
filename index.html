<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krishna Particle Animation</title>
  <meta name="description" content="A beautiful Krishna particle animation created by Vinit Kumar Giri." />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05050c;
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    #stage {
      position: relative;
      width: min(100vw, 510px);
      height: min(100vh, 830px);
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(72, 45, 18, .13), transparent 42%),
        #05050c;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

   #name {
    position: absolute;
    left: 50%;
    top: 90%;
    transform: translateX(-50%);

    width: 100%;
    text-align: center;

    color: #ffd764;
    font-size: clamp(16px, 3.5vw, 26px);
    letter-spacing: 1px;

    text-shadow:
        0 0 5px rgba(255, 215, 100, .75),
        0 0 16px rgba(255, 190, 60, .45),
        0 0 28px rgba(255, 190, 60, .22);

    opacity: 0;
    transition: opacity .2s linear;
    pointer-events: none;
}

    #musicButton {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 60px;
      height: 60px;
      padding: 0;
      border: 2px solid #ebc878;
      border-radius: 50%;
      background: rgba(15, 15, 25, .88);
      box-shadow:
        0 0 12px rgba(255, 210, 110, .28),
        inset 0 0 10px rgba(255, 255, 255, .04);
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 10;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    #musicButton:hover {
      transform: scale(1.06);
      box-shadow:
        0 0 20px rgba(255, 210, 110, .42),
        inset 0 0 10px rgba(255, 255, 255, .05);
    }

    #musicButton:active { transform: scale(.96); }

    #musicButton svg {
      width: 29px;
      height: 29px;
      overflow: visible;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 86px;
      transform: translateX(-50%);
      color: rgba(255,255,255,.38);
      font: 12px/1.2 Arial, sans-serif;
      pointer-events: none;
      opacity: 0;
      transition: opacity .4s ease;
    }

    #stage.show-hint .hint { opacity: 10; }
  </style>
</head>
<body>
  <main id="stage">
    <canvas id="canvas"></canvas>
    <div id="name">
    <div>🦚 राधे कृष्ण 🦚</div>
    <div>🪷 🪄 Vinit Giri 🪈 🦚 </div>
    
</div>

    <button id="musicButton" type="button" aria-label="Turn music on" title="Turn music on">
      <svg id="speakerIcon" viewBox="0 0 48 48" aria-hidden="true">
        <path id="speakerBody"
          d="M8 19h8l9-7v24l-9-7H8z"
          fill="#f8f8fa"/>
        <g id="waves" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
          <path d="M29 17c4 4 4 10 0 14"/>
          <path d="M34 13c7 7 7 15 0 22"/>
          <path d="M39 9c10 10 10 20 0 30"/>
        </g>
        <g id="slash" display="none" stroke-linecap="round">
          <path d="M10 10L38 38" stroke="#08080e" stroke-width="7"/>
          <path d="M11 11L37 37" stroke="#ff6969" stroke-width="4"/>
          <path d="M12 12L36 36" stroke="#ffe1e1" stroke-width="1.5"/>
        </g>
      </svg>
    </button>

    <div class="hint">Tap the speaker to play music</div>
    <audio id="audio" src="song.mp3" loop preload="auto"></audio>
    <img id="krishnaSource" src="krishna.png" alt="" hidden />
  </main>

<script>
(() => {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { alpha: false });
  const source = document.getElementById("krishnaSource");
  const nameEl = document.getElementById("name");
  const audio = document.getElementById("audio");
  const button = document.getElementById("musicButton");
  const waves = document.getElementById("waves");
  const slash = document.getElementById("slash");
  const stage = document.getElementById("stage");

  const W = 510;
  const H = 830;
  const MAX_W = 400;
  const MAX_H = 650;
  const GAP = 5;

  let particles = [];
  let sparkles = [];
  let startTime = performance.now();
  let imageReady = false;
  let musicOn = false;
  let audioStarted = false;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = "100%";
    canvas.style.height = "100%";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  resize();
  window.addEventListener("resize", resize);

  function fitImage(img) {
    const scale = Math.min(MAX_W / img.naturalWidth, MAX_H / img.naturalHeight);
    const width = Math.max(1, Math.floor(img.naturalWidth * scale));
    const height = Math.max(1, Math.floor(img.naturalHeight * scale));
    return {
      width,
      height,
      x: Math.floor((W - width) / 2),
      y: Math.floor((H - height) / 2)
    };
  }

  function buildParticles() {
    if (!source.naturalWidth || !source.naturalHeight) return;

    const box = fitImage(source);
    const temp = document.createElement("canvas");
    temp.width = box.width;
    temp.height = box.height;
    const tctx = temp.getContext("2d");
    tctx.drawImage(source, 0, 0, box.width, box.height);

    const data = tctx.getImageData(0, 0, box.width, box.height).data;
    particles = [];

    for (let y = 0; y < box.height; y += GAP) {
      for (let x = 0; x < box.width; x += GAP) {
        const i = (y * box.width + x) * 4;
        const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];

        if (a > 40 && (r > 30 || g > 30 || b > 30)) {
          particles.push({
            x: W / 2 + (Math.random() * 500 - 250),
            y: H / 2 + (Math.random() * 700 - 350),
            tx: box.x + x,
            ty: box.y + y,
            r, g, b,
            delay: Math.random() * 5000,
            size: 1 + Math.floor(Math.random() * 3),
            speed: .010 + Math.random() * .018,
            angle: Math.random() * Math.PI * 2
          });
        }
      }
    }

    imageReady = true;
  }

  source.addEventListener("load", buildParticles);
  source.addEventListener("error", () => {
    console.warn("krishna.png was not found. Put krishna.png beside index.html.");
  });

  if (source.complete) buildParticles();

  function drawSparkles(t, dt) {
    if (t > 5000 && Math.random() < 0.15) {
      const box = fitImage(source);
      sparkles.push({
        x: box.x + Math.random() * box.width,
        y: box.y + Math.random() * box.height,
        life: .5 + Math.random(),
        maxLife: 1.5,
        size: 1 + Math.floor(Math.random() * 3)
      });
    }

    for (let i = sparkles.length - 1; i >= 0; i--) {
      const s = sparkles[i];
      s.life -= dt;
      if (s.life <= 0) {
        sparkles.splice(i, 1);
        continue;
      }

      const alpha = Math.max(0, Math.min(1, s.life / s.maxLife));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.shadowBlur = 8;
      ctx.shadowColor = "rgba(255,255,255,.65)";
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function draw(t) {
    const now = performance.now();
    const elapsed = now - startTime;
    const dt = Math.min((now - t) / 1000, .05);

    ctx.fillStyle = "#05050c";
    ctx.fillRect(0, 0, W, H);

    if (imageReady) {
      for (const p of particles) {
        if (elapsed < p.delay) continue;

        const dx = p.tx - p.x;
        const dy = p.ty - p.y;
        p.x += dx * p.speed;
        p.y += dy * p.speed;

        const waveX = Math.sin(elapsed / 1000 * 3 + p.angle) * .8;
        const waveY = Math.cos(elapsed / 1000 * 3 + p.angle) * .8;
        const x = Math.round(p.x + waveX);
        const y = Math.round(p.y + waveY);
        const distance = Math.hypot(dx, dy);

        if (distance < 30) {
          const glowSize = p.size * 5;
          const gradient = ctx.createRadialGradient(
            x, y, 0, x, y, glowSize
          );
          gradient.addColorStop(0, `rgba(${p.r},${p.g},${p.b},.22)`);
          gradient.addColorStop(1, `rgba(${p.r},${p.g},${p.b},0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(x, y, glowSize, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      drawSparkles(elapsed, dt);

      // Final image reveal after 55 seconds.
      if (elapsed > 9000) {
        const alpha = Math.min(1, (elapsed - 9000) / 1800);
        const box = fitImage(source);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.drawImage(source, box.x, box.y, box.width, box.height);
        ctx.restore();
      }

      // Name animation.
      const nameStart = 9800;
      if (elapsed > nameStart) {
        const progress = Math.min(1, (elapsed - nameStart) / 1200);
        const nameAlpha = (1 - Math.cos(progress * Math.PI)) / 2;
        const floatingY = Math.sin(elapsed / 1000 * 2) * 3;
        nameEl.style.opacity = nameAlpha.toFixed(3);
        nameEl.style.top = `calc(90% + ${floatingY}px)`;
      }
    }

    requestAnimationFrame((nextTime) => draw(now));
  }

  // Initial mute state.
  function setMutedVisual(muted) {
    waves.style.display = muted ? "none" : "block";
    slash.style.display = muted ? "block" : "none";
    button.setAttribute("aria-label", muted ? "Turn music on" : "Turn music off");
    button.title = muted ? "Turn music on" : "Turn music off";
  }

  setMutedVisual(true);

  button.addEventListener("click", async () => {
    try {
      if (!musicOn) {
        if (audioStarted) {
          await audio.play();
        } else {
          audio.currentTime = 0;
          await audio.play();
          audioStarted = true;
        }
        musicOn = true;
        setMutedVisual(false);
        stage.classList.remove("show-hint");
      } else {
        audio.pause();
        musicOn = false;
        setMutedVisual(true);
      }
    } catch (err) {
      console.error("Music could not be played:", err);
      setMutedVisual(true);
    }
  });

  // Show a small hint briefly.
  setTimeout(() => stage.classList.add("show-hint"), 1200);
  setTimeout(() => stage.classList.remove("show-hint"), 5000);

  requestAnimationFrame((t) => draw(t));
})();
</script>
</body>
</html>
